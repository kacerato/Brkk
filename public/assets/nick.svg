<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Character: Nick -->
  <!-- Style: Cute but Macabre (Pale skin, big eyes, stitches) -->

  <!-- Head -->
  <circle cx="32" cy="20" r="14" fill="#E0E0E0" stroke="#333" stroke-width="2" />

  <!-- Eyes (Big, hollow, one bigger than other) -->
  <circle cx="28" cy="18" r="4" fill="#000" />
  <circle cx="38" cy="18" r="3" fill="#000" />
  <circle cx="38" cy="18" r="1" fill="#FFF" opacity="0.5" />

  <!-- Mouth (Stitched) -->
  <path d="M28 28 Q32 32 36 28" stroke="#333" stroke-width="1" fill="none" />
  <line x1="29" y1="26" x2="29" y2="30" stroke="#333" stroke-width="1" />
  <line x1="32" y1="28" x2="32" y2="32" stroke="#333" stroke-width="1" />
  <line x1="35" y1="26" x2="35" y2="30" stroke="#333" stroke-width="1" />

  <!-- Hair (Black, messy) -->
  <path d="M18 20 Q18 10 32 6 Q46 10 46 20 L48 30 Q48 35 40 30 L46 20 L44 14 Q32 10 20 14 L18 20 L16 30 Q16 35 24 30 L18 20" fill="#111" />

  <!-- Body (Dress) -->
  <path d="M24 34 L20 54 L44 54 L40 34 Z" fill="#4A235A" />

  <!-- Arms -->
  <line x1="24" y1="36" x2="18" y2="44" stroke="#E0E0E0" stroke-width="3" />
  <line x1="40" y1="36" x2="46" y2="44" stroke="#E0E0E0" stroke-width="3" />

  <!-- Legs -->
  <line x1="26" y1="54" x2="26" y2="62" stroke="#333" stroke-width="2" />
  <line x1="38" y1="54" x2="38" y2="62" stroke="#333" stroke-width="2" />
</svg>
