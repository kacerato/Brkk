<svg width="100" height="150" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88aaff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#88aaff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect width="100" height="150" fill="#111" stroke="#333" stroke-width="5"/>

  <!-- Glass -->
  <rect x="5" y="5" width="90" height="140" fill="#001133"/>

  <!-- Divider -->
  <line x1="50" y1="5" x2="50" y2="145" stroke="#333" stroke-width="3"/>
  <line x1="5" y1="50" x2="95" y2="50" stroke="#333" stroke-width="3"/>

  <!-- Rain Streaks -->
  <line x1="20" y1="10" x2="20" y2="40" stroke="url(#rain)" stroke-width="1"/>
  <line x1="60" y1="30" x2="60" y2="70" stroke="url(#rain)" stroke-width="1"/>
  <line x1="80" y1="80" x2="80" y2="120" stroke="url(#rain)" stroke-width="1"/>

  <!-- Lightning Flash (hidden by default, can toggle opacity in game) -->
  <rect width="100" height="150" fill="#fff" opacity="0.1"/>
</svg>