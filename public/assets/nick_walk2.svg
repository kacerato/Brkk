<svg width="128" height="200" viewBox="0 0 128 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="sketchy">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
  </defs>

  <!-- Legs (Walk 2: Right Forward) -->
  <g transform="translate(64, 160)">
    <!-- Left Leg (Back) -->
    <path d="M-15,0 L-5,30 L5,30 L-5,0 Z" fill="#ffddc1" stroke="#331111" stroke-width="1"/>
    <path d="M-6,30 Q-6,35 0,35 Q6,35 6,30 L-6,30 Z" fill="#550000" />

    <!-- Right Leg (Front) -->
    <path d="M5,0 L15,30 L25,30 L15,0 Z" fill="#ffddc1" stroke="#331111" stroke-width="1"/>
    <path d="M14,30 Q14,35 20,35 Q26,35 26,30 L14,30 Z" fill="#550000" />
  </g>

  <!-- Body Group (Bobbing Down) -->
  <g transform="translate(0, 2)">
      <!-- Dress -->
      <g transform="translate(64, 110)">
        <!-- Skirt -->
        <path d="M0,-20 L-25,50 Q0,55 25,50 L0,-20 Z" fill="#fff5e6" stroke="#222" stroke-width="1.5" />
        <!-- Polka Dots -->
        <circle cx="-10" cy="10" r="2" fill="#aa0000" opacity="0.8"/>
        <circle cx="10" cy="20" r="2" fill="#aa0000" opacity="0.8"/>
        <circle cx="0" cy="35" r="2" fill="#aa0000" opacity="0.8"/>
        <circle cx="-15" cy="40" r="2" fill="#aa0000" opacity="0.8"/>
        <circle cx="15" cy="5" r="2" fill="#aa0000" opacity="0.8"/>

        <!-- Blue Lace Trim -->
        <path d="M-25,50 Q-12,55 0,52 Q12,55 25,50" stroke="#0044aa" stroke-width="3" fill="none" stroke-dasharray="2,2"/>

        <!-- Arms (Swinging Opposite) -->
        <path d="M-18,-15 L-30,10" stroke="#ffddc1" stroke-width="6" stroke-linecap="round"/>
        <path d="M18,-15 L30,10" stroke="#ffddc1" stroke-width="6" stroke-linecap="round"/>

        <!-- Puff Sleeves -->
        <circle cx="-20" cy="-15" r="8" fill="#fff5e6" stroke="#222" stroke-width="1"/>
        <circle cx="20" cy="-15" r="8" fill="#fff5e6" stroke="#222" stroke-width="1"/>
        <path d="M-25,-10 Q-20,-5 -15,-10" stroke="#0044aa" stroke-width="2" fill="none"/>
        <path d="M15,-10 Q20,-5 25,-10" stroke="#0044aa" stroke-width="2" fill="none"/>

        <!-- Bodice -->
        <path d="M-12,-20 L-12,10 L12,10 L12,-20 Z" fill="#fff5e6" />
        <circle cx="-5" cy="-5" r="1.5" fill="#aa0000"/>
        <circle cx="5" cy="0" r="1.5" fill="#aa0000"/>
      </g>

      <!-- Apple Head Hood -->
      <g transform="translate(64, 60)">
        <!-- Main Apple Shape -->
        <path d="M-45,-10 C-60,-30 -60,20 -40,40 C-30,50 -20,45 -15,55 C-10,60 10,60 15,55 C20,45 30,50 40,40 C60,20 60,-30 45,-10 C40,-35 20,-35 0,-25 C-20,-35 -40,-35 -45,-10 Z" fill="#cc2222" stroke="#220000" stroke-width="2" />

        <!-- Dripping bottom effect -->
        <path d="M-40,40 Q-30,55 -20,45 Q-15,60 -5,48 Q5,60 15,45 Q25,55 40,40" fill="#cc2222" stroke="none"/>

        <!-- Texture/Shading -->
        <path d="M-30,-10 Q-20,0 -35,20" stroke="#aa0000" stroke-width="2" fill="none" opacity="0.5"/>
        <path d="M30,-10 Q20,0 35,20" stroke="#aa0000" stroke-width="2" fill="none" opacity="0.5"/>

        <!-- Stem and Leaf -->
        <path d="M0,-25 Q5,-35 15,-40" stroke="#4a2c0f" stroke-width="4" fill="none"/>
        <path d="M5,-35 Q20,-50 30,-30 Q15,-25 5,-35" fill="#44aa22" stroke="#225511" stroke-width="1"/>

        <!-- Eyes on Apple -->
        <g transform="translate(-30, -10)">
          <ellipse cx="0" cy="0" rx="6" ry="4" fill="#fff" stroke="#000" stroke-width="1"/>
          <circle cx="0" cy="0" r="2" fill="#2244aa"/>
          <circle cx="0" cy="0" r="1" fill="#000"/>
        </g>
        <g transform="translate(35, -5)">
          <ellipse cx="0" cy="0" rx="7" ry="5" fill="#fff" stroke="#000" stroke-width="1"/>
          <circle cx="2" cy="0" r="2.5" fill="#2244aa"/>
          <circle cx="2" cy="0" r="1.2" fill="#000"/>
        </g>
        <g transform="translate(-25, 25)">
          <ellipse cx="0" cy="0" rx="5" ry="3" fill="#fff" stroke="#000" stroke-width="1"/>
          <circle cx="-1" cy="0" r="1.5" fill="#2244aa"/>
        </g>
        <g transform="translate(30, 30) rotate(20)">
          <ellipse cx="0" cy="0" rx="6" ry="4" fill="#fff" stroke="#000" stroke-width="1"/>
          <circle cx="0" cy="0" r="2" fill="#2244aa"/>
        </g>

        <!-- Face Cutout (Inside the Apple Mouth) -->
        <!-- Dark background for inside -->
        <path d="M-25,10 Q0,5 25,10 Q25,40 0,45 Q-25,40 -25,10" fill="#331111" stroke="#220000" stroke-width="1"/>

        <!-- Girl's Face -->
        <clipPath id="faceClip">
          <path d="M-25,10 Q0,5 25,10 Q25,40 0,45 Q-25,40 -25,10" />
        </clipPath>

        <g clip-path="url(#faceClip)">
            <!-- Skin -->
            <rect x="-30" y="0" width="60" height="50" fill="#ffddc1"/>
            <!-- Hair (Brown Bob) -->
            <path d="M-20,5 Q0,0 20,5 L22,30 Q20,25 15,30 Q15,10 0,10 Q-15,10 -15,30 Q-20,25 -22,30 Z" fill="#885533"/>
            <path d="M-20,5 Q-25,15 -22,30" stroke="#663311" stroke-width="1" fill="none"/>
            <path d="M20,5 Q25,15 22,30" stroke="#663311" stroke-width="1" fill="none"/>

            <!-- Fringe/Bangs -->
            <path d="M-20,5 Q-10,15 0,10 Q10,15 20,5" fill="#885533"/>

            <!-- Eyes (Anime style) -->
            <g transform="translate(-8, 20)">
                <ellipse cx="0" cy="0" rx="3" ry="3.5" fill="#fff"/>
                <circle cx="0" cy="0" r="2" fill="#2266cc"/> <!-- Blue eyes -->
                <circle cx="0" cy="0" r="1" fill="#000"/>
                <circle cx="1" cy="-1" r="0.8" fill="#fff"/> <!-- Reflection -->
            </g>
            <g transform="translate(8, 20)">
                <ellipse cx="0" cy="0" rx="3" ry="3.5" fill="#fff"/>
                <circle cx="0" cy="0" r="2" fill="#2266cc"/>
                <circle cx="0" cy="0" r="1" fill="#000"/>
                <circle cx="-1" cy="-1" r="0.8" fill="#fff"/>
            </g>

            <!-- Mouth -->
            <path d="M-2,28 Q0,29 2,28" stroke="#aa5544" stroke-width="1" fill="none"/>
        </g>
      </g>
  </g>
</svg>