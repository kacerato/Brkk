<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Creepy Room Background -->
  <rect width="800" height="600" fill="#1a1a1a" />

  <!-- Wall Texture -->
  <path d="M0 0 L800 0 L800 450 L0 450 Z" fill="#2c2c2c" />
  <line x1="100" y1="0" x2="100" y2="450" stroke="#222" stroke-width="2" />
  <line x1="300" y1="0" x2="300" y2="450" stroke="#222" stroke-width="2" />
  <line x1="500" y1="0" x2="500" y2="450" stroke="#222" stroke-width="2" />
  <line x1="700" y1="0" x2="700" y2="450" stroke="#222" stroke-width="2" />

  <!-- Floor -->
  <path d="M0 450 L800 450 L800 600 L0 600 Z" fill="#111" />

  <!-- Window (Barred) -->
  <rect x="350" y="100" width="100" height="100" fill="#050510" stroke="#333" stroke-width="4" />
  <line x1="380" y1="100" x2="380" y2="200" stroke="#000" stroke-width="3" />
  <line x1="420" y1="100" x2="420" y2="200" stroke="#000" stroke-width="3" />

  <!-- Moonlight -->
  <path d="M350 200 L320 450 L480 450 L450 200" fill="#FFF" opacity="0.1" />

  <!-- Scratches -->
  <path d="M50 50 L70 80 M60 50 L50 80" stroke="#000" opacity="0.3" />
</svg>
